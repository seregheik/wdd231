<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="title" content="Chamber Project">
    <meta name="description" content="This is a chamber of commerce project">
    <meta name="author" content="Osasere Ikponmwosa">
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/styles.css">
    <script src="scripts/courselist.js" defer></script>
    <script src="scripts/scripts.js" defer></script>
    <title>Chamber Project</title>
</head>
<body>
    <header>
        <div class="header-top">
            <div class="logo-title">
                <img src="images/chamber-of-commerce-1.svg" alt="Chamber of commerce logo" class="logo" width="60" height="60">
                <span class="site-name">Chamber of Commerce</span>
            </div>
            <button id="menu-btn" class="menu-btn">&#9776;</button>
        </div>
        <nav>
            <a href="#" class="active">Home</a>
            <a href="#">Chamber Project</a>
            <a href="#">Final Project</a>
        </nav>
    </header>
    <main>
        <h1>Home</h1>
        <div class="main-grid">
            <section class="about-me">
                <h2>About Me</h2>
                <div class="section-content">
                    <p>My name is Osasere Ikponmwosa and I am 28 years old. I am from Edo State, Nigeria. I love music and I am a software developer.</p>
                </div>
            </section>
            <section class="student-profile">
                <h2>Student Photo</h2>
                <div class="section-content">
                    <div class="photo-placeholder">
                        <img src="images/studentimage.jpeg" alt="Osasere Image" width="250" height="250">
                    </div>
                </div>
            </section>
        </div>
        <section class="web-certificate">
            <h2>Web Certificate Courses</h2>
            <div class="section-content">
                <div class="filter-buttons">
                    <button id="btn-all">All</button>
                    <button id="btn-cse">CSE</button>
                    <button id="btn-wdd">WDD</button>
                </div>
                <div id="course-list" class="course-list">
                </div>
                <p id="credits-info" class="credits-info"></p>
            </div>
        </section>
    </main>
    <footer>
        <div class="social-icons">
            <img src="images/linkedin.svg" alt="linkedin" width="40" height="40">
            <img src="images/github.svg" alt="github" width="40" height="40">
            <img src="images/x.svg" alt="x formerly twitter" width="40" height="40">
        </div>
        <div class="footer-info">
            &copy; <span id="currentyear"></span> &bull; Student Name &bull; Utah, USA
        </div>
        <div class="last-modified">
            Last Modification: <span id="lastModified"></span>
        </div>
    </footer>
</body>
</html>
